name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test (Windows x64)
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup .NET 10
        uses: actions/setup-dotnet@3951f0dfe7a07e2313ec93c75700083e2005cbab # v4.3.0
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore AIQuotaBar.slnx

      - name: Build Solution
        run: dotnet build AIQuotaBar.slnx -c Release --no-restore

      - name: Run Unit Tests
        run: dotnet test AIQuotaBar.slnx -c Release --no-build
