name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test (Windows x64)
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup .NET 10
        uses: actions/setup-dotnet@3951f0dfe7a07e2313ec93c75700083e2005cbab # v4.3.0
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore AIQuotaBar.slnf

      - name: Build Solution
        run: dotnet build AIQuotaBar.slnf -c Release --no-restore

      - name: Run Unit Tests
        run: dotnet test AIQuotaBar.slnf -c Release --no-build

  msix-packaging-validation:
    name: MSIX Packaging Validation
    runs-on: windows-latest

    # Authoritative Validation Model:
    # - Normal application CI (build-and-test) is authoritative on GitHub.
    # - MSIX packaging compilation is validated locally on developer machines with
    #   Visual Studio + DesktopBridge + Windows SDK 10.0.22621.0.
    # - Hosted GitHub runners validate packaging only when the required UAP SDK is available.

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup .NET 10
        uses: actions/setup-dotnet@3951f0dfe7a07e2313ec93c75700083e2005cbab # v4.3.0
        with:
          dotnet-version: '10.0.x'

      - name: Restore Packaging Dependencies
        run: dotnet restore AIQuotaBar.slnf

      - name: Check UAP SDK Availability
        id: check-uap
        shell: powershell
        run: |
          $targetVersion = "10.0.22621.0"
          $uapPlatformsRoot = "${env:ProgramFiles(x86)}\Windows Kits\10\Platforms\UAP"
          $uapDesignTimeProps = "${env:ProgramFiles(x86)}\Windows Kits\10\DesignTime\CommonConfiguration\Neutral\UAP\$targetVersion\UAP.props"
          $uapPlatformXml = "${env:ProgramFiles(x86)}\Windows Kits\10\Platforms\UAP\$targetVersion\Platform.xml"

          if (Test-Path $uapPlatformsRoot) {
            $installed = (Get-ChildItem -Path $uapPlatformsRoot -Directory | Select-Object -ExpandProperty Name) -join ", "
            Write-Host "Installed UAP platform versions: $installed"
          } else {
            Write-Host "UAP platforms directory not found at: $uapPlatformsRoot"
          }

          $uapAvailable = (Test-Path $uapDesignTimeProps) -and (Test-Path $uapPlatformXml)
          Write-Host "UAP $targetVersion SDK Available: $uapAvailable"

          if (-not $uapAvailable) {
            Write-Host "::warning::Hosted GitHub runner lacks Windows UAP SDK $targetVersion (UAP.props / Platform.xml). MSIX packaging validation is skipped on this runner. Authoritative MSIX package compilation is validated locally on developer workstations equipped with Visual Studio and Windows SDK $targetVersion."
          }

          if ($env:GITHUB_OUTPUT) {
            Add-Content -Path $env:GITHUB_OUTPUT -Value "uap_available=$($uapAvailable.ToString().ToLowerInvariant())"
          }

      - name: Build & Validate MSIX Packaging
        if: steps.check-uap.outputs.uap_available == 'true'
        shell: powershell
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) {
            $vswhere = "vswhere.exe"
          }
          $msbuild = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find MSBuild\**\Bin\amd64\MSBuild.exe | Select-Object -First 1
          if (-not $msbuild) {
            $msbuild = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find MSBuild\**\Bin\MSBuild.exe | Select-Object -First 1
          }
          if (-not $msbuild -or -not (Test-Path $msbuild)) {
            throw "MSBuild executable could not be located via vswhere."
          }
          Write-Host "Discovered MSBuild: $msbuild"
          & $msbuild src/AIQuotaBar.Package/AIQuotaBar.Package.wapproj `
            -p:Configuration=Release `
            -p:Platform=x64 `
            -p:AppxPackageSigningEnabled=false `
            -p:AppxBundlePlatforms=x64
