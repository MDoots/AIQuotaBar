name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test (Windows x64)
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore AIQuotaBar.slnx

      - name: Build Solution
        run: dotnet build AIQuotaBar.slnx -c Release --no-restore

      - name: Run Unit Tests
        run: dotnet test AIQuotaBar.slnx -c Release --no-build
