name: Bug Report
description: Report a bug or unexpected behavior in AIQuotaBar
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue!
        **CRITICAL:** Do NOT share credentials, session tokens, API keys, or private account information in this issue.
  - type: textarea
    id: description
    attributes:
      label: Problem Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this issue?
      placeholder: |
        1. Launch AIQuotaBar
        2. Perform action...
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: dropdown
    id: providers
    attributes:
      label: Affected Provider(s)
      multiple: true
      options:
        - OpenAI Codex
        - Google Antigravity
        - Claude Code
        - Grok Build
        - GitHub Copilot
        - General Widget UI / Tray
        - Settings & Persistence
    validations:
      required: false
  - type: textarea
    id: environment
    attributes:
      label: Environment Details
      description: OS version, AIQuotaBar version, provider CLI versions (sanitized).
      value: |
        - OS: Windows 11 x64
        - AIQuotaBar Version: 1.0.0
    validations:
      required: true
